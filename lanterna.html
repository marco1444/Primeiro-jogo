<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lanterna</title>
<style>
:root{--bg:#0d1024;--ink:#f3ecd8;--amber:#ffb84d;--teal:#4fd1c5;--rock:#3a4380;--muted:#9aa0c8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{width:100%;max-width:960px;height:auto;aspect-ratio:16/9;background:#000;border-radius:10px;border:2px solid var(--rock)}
p{margin:0;color:var(--muted);font-size:14px;text-align:center}
.pad{display:none;width:100%;max-width:960px;justify-content:space-between;gap:12px}
.pad div{display:flex;gap:12px}
.pad button{width:84px;height:68px;border-radius:14px;border:2px solid var(--rock);background:#1a1f3d;color:var(--ink);font-size:28px;touch-action:none}
.pad button:active{background:var(--rock)}
@media (pointer:coarse){.pad{display:flex}p{display:none}}
</style>
</head>
<body>
<canvas id="c" width="800" height="450" aria-label="Jogo de plataforma Lanterna"></canvas>
<p>Andar: ← → ou A D. Pular: Espaço, ↑ ou W.</p>
<div class="pad"><div><button data-k="l">←</button><button data-k="r">→</button></div><button data-k="j">Pular</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=800,H=450;
const LV=[
{w:1900,p:[[0,400,500],[600,400,500],[1200,400,700],[250,320,110],[420,250,110],[720,310,110],[900,250,110],[1300,320,120],[1500,260,120]],
 s:[[690,400,50],[860,400,50],[1290,400,50],[1650,400,50]],c:[[300,290],[470,220],[770,280],[950,220],[1350,290],[1550,230],[1700,370]],d:[1820,340]},
{w:2100,p:[[0,400,350],[460,400,200],[770,400,200],[1080,400,200],[1390,400,710],[200,310,100],[360,250,100],[560,300,100],[690,230,100],[880,300,100],[1000,220,100],[1200,300,100],[1330,230,100],[1700,300,120],[1880,240,100]],
 s:[[1500,400,60],[1620,400,60],[1740,400,60],[1900,400,60]],c:[[250,280],[410,220],[610,270],[740,200],[930,270],[1050,190],[1250,270],[1380,200],[1750,270],[1930,210]],d:[2020,340]},
{w:2300,p:[[0,400,300],[410,400,150],[670,400,150],[930,400,150],[1190,400,150],[1450,400,850],[160,320,90],[310,260,90],[560,310,90],[650,230,90],[840,310,90],[1100,300,90],[1190,220,90],[1380,300,90],[1650,300,100],[1820,230,100],[2000,300,100]],
 s:[[470,400,40],[1550,400,60],[1700,400,60],[1850,400,60]],c:[[200,290],[340,230],[600,280],[690,200],[880,280],[1130,270],[1230,190],[1420,270],[1700,270],[1870,200],[2050,270]],d:[2220,340]},
{w:2500,p:[[0,400,260],[370,400,140],[620,400,140],[870,400,140],[1120,400,140],[1370,400,140],[1620,400,880],[180,320,80],[290,250,80],[440,310,80],[700,310,80],[950,310,80],[1040,240,80],[1200,310,80],[1450,310,80],[1740,310,80],[1900,250,80],[2060,310,80],[2230,250,80]],
 s:[[425,400,40],[675,400,40],[925,400,40],[1175,400,40],[1425,400,40],[1700,400,50],[1830,400,50],[1960,400,50],[2090,400,50],[2340,400,50]],c:[[220,290],[330,220],[480,280],[740,280],[990,280],[1080,210],[1240,280],[1490,280],[1780,280],[1940,220],[2100,280],[2270,220]],d:[2440,340]},
{w:2600,p:[[0,400,250],[370,400,100],[590,400,100],[810,400,100],[1030,400,100],[1250,400,100],[1470,400,100],[1690,400,910],[150,320,70],[400,310,70],[620,310,70],[840,310,70],[1060,310,70],[1280,310,70],[1500,310,70],[1800,300,60],[1930,240,60],[2060,300,60],[2190,240,60],[2320,300,60]],
 s:[[1790,400,50],[1900,400,50],[2010,400,50],[2120,400,50],[2230,400,50],[2400,400,50]],c:[[185,290],[435,280],[655,280],[875,280],[1095,280],[1315,280],[1535,280],[1830,270],[1960,210],[2090,270],[2220,210],[2350,270]],d:[2520,340]}
];
const stars=[];for(let i=0;i<70;i++)stars.push([(i*397)%W,(i*181)%300,(i%3)+1]);
let state='title',li=0,plats,sp,coins,door,lw,P,got,deaths=0,msg=0,t=0,rocks=[],bats=[],rt=0,bt=0;
const keys={},touch={l:0,r:0,j:0};
function load(i){const l=LV[i];li=i;lw=l.w;plats=l.p.map(a=>({x:a[0],y:a[1],w:a[2],h:a[1]>=400?50:16}));sp=l.s;coins=l.c;got=coins.map(()=>0);door={x:l.d[0],y:l.d[1],w:30,h:60};P={x:40,y:370,w:22,h:30,vx:0,vy:0,coy:0,jh:0,f:1};msg=90;rocks=[];bats=[];rt=120;bt=200}
function start(){if(state==='play')return;deaths=0;load(0);state='play'}
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(state!=='play'&&(e.code==='Enter'||e.code==='Space'))start()});
addEventListener('keyup',e=>keys[e.code]=0);
cv.addEventListener('pointerdown',()=>{if(state!=='play')start()});
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,on=e=>{e.preventDefault();touch[k]=1;start()},off=e=>{e.preventDefault();touch[k]=0};
b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,off))});
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function die(){deaths++;load(li);msg=0}
const HZ=[[240,300],[190,240],[150,200],[120,160],[90,130]];
function hz(){
const [ra,ba]=HZ[li],cam=Math.max(0,Math.min(lw-W,P.x-W/2));
if(--rt<=0){rt=ra*(.5+Math.random());rocks.push({x:Math.max(20,Math.min(lw-20,P.x+(Math.random()-.5)*260)),y:-30,wt:45,v:3})}
if(--bt<=0){bt=ba*(.5+Math.random());bats.push({x:0,y:[372,332,292][Math.random()*3|0],v:2.5+Math.random()*2.5+li*.4,ph:Math.random()*6,wt:45})}
for(const r of rocks){if(r.wt>0){r.wt--;continue}r.v=Math.min(r.v+.5,13);r.y+=r.v;const b={x:r.x-9,y:r.y-12,w:18,h:26};if(hit(P,b))return 1;if(plats.some(q=>hit(q,b)))r.y=999}
rocks=rocks.filter(r=>r.y<H+40);
for(const b of bats){if(b.wt>0){if(--b.wt===0)b.x=cam+W+30;continue}b.x-=b.v;if(hit(P,{x:b.x-12,y:b.y+Math.sin(t/8+b.ph)*6-7,w:24,h:14}))return 1}
bats=bats.filter(b=>b.wt>0||b.x>P.x-W);
return 0}
function step(){
const l=keys.ArrowLeft||keys.KeyA||touch.l,r=keys.ArrowRight||keys.KeyD||touch.r,j=keys.Space||keys.ArrowUp||keys.KeyW||touch.j;
P.vx=((r?1:0)-(l?1:0))*3.4;if(P.vx)P.f=P.vx>0?1:-1;
P.x+=P.vx;if(P.x<0)P.x=0;
for(const q of plats)if(hit(P,q))P.x=P.vx>0?q.x-P.w:q.x+q.w;
P.coy=Math.max(0,P.coy-1);
if(j&&!P.jh&&P.coy>0){P.vy=-11.2;P.coy=0}
P.jh=j;if(!j&&P.vy<-4)P.vy=-4;
P.vy=Math.min(P.vy+.55,14);P.y+=P.vy;
for(const q of plats)if(hit(P,q)){if(P.vy>0){P.y=q.y-P.h;P.coy=6}else P.y=q.y+q.h;P.vy=0}
if(P.y>H+80||hz())return die();
for(const s of sp)if(hit(P,{x:s[0]+3,y:s[1]-14,w:s[2]-6,h:14}))return die();
coins.forEach((c,i)=>{if(!got[i]&&Math.hypot(P.x+11-c[0],P.y+15-c[1])<24)got[i]=1});
if(got.every(Boolean)&&hit(P,door)){if(li<LV.length-1)load(li+1);else state='win'}
}
function draw(){
t++;ctx.clearRect(0,0,W,H);
const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0d1024');bg.addColorStop(1,'#1b2150');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#e8e4ff';for(const s of stars){ctx.globalAlpha=.25+.2*Math.sin(t/30+s[0]);ctx.fillRect(s[0],s[1],s[2],s[2])}ctx.globalAlpha=1;
if(state==='title'||state==='win'){
ctx.textAlign='center';ctx.fillStyle='#ffb84d';ctx.font='700 56px Georgia,serif';
ctx.fillText(state==='win'?'A caverna está acesa':'Lanterna',W/2,170);
ctx.fillStyle='#f3ecd8';ctx.font='20px "Trebuchet MS",sans-serif';
ctx.fillText(state==='win'?'Você coletou todas as faíscas com '+deaths+(deaths===1?' queda.':' quedas.'):'Colete todas as faíscas para abrir a porta de cada fase.',W/2,225);
ctx.fillStyle='#4fd1c5';ctx.fillText('Pressione Enter, Espaço ou toque para '+(state==='win'?'jogar de novo':'começar'),W/2,290);
return}
const cam=Math.max(0,Math.min(lw-W,P.x-W/2)),cx=P.x+P.w/2-cam,cy=P.y+P.h/2;
ctx.save();ctx.translate(-cam,0);
ctx.fillStyle='#3a4380';for(const q of plats){ctx.fillRect(q.x,q.y,q.w,q.h);ctx.fillStyle='#6a76c8';ctx.fillRect(q.x,q.y,q.w,4);ctx.fillStyle='#3a4380'}
ctx.fillStyle='#e0566b';for(const s of sp)for(let x=s[0];x<s[0]+s[2];x+=10){ctx.beginPath();ctx.moveTo(x,s[1]);ctx.lineTo(x+5,s[1]-16);ctx.lineTo(x+10,s[1]);ctx.fill()}
const open=got.every(Boolean);
ctx.fillStyle=open?'#ffb84d':'#555a85';ctx.fillRect(door.x,door.y,door.w,door.h);ctx.fillStyle='#0d1024';ctx.fillRect(door.x+6,door.y+10,door.w-12,door.h-10);
ctx.fillStyle='#4fd1c5';ctx.fillRect(P.x,P.y+10,P.w,P.h-10);ctx.fillStyle='#f3ecd8';ctx.fillRect(P.x+4,P.y,14,12);
ctx.fillStyle='#0d1024';ctx.fillRect(P.x+(P.f>0?11:5),P.y+4,3,3);
const fl=3*Math.sin(t/6);ctx.fillStyle='#ffb84d';ctx.beginPath();ctx.arc(P.x+(P.f>0?P.w+4:-4),P.y+18,5+fl/3,0,7);ctx.fill();
ctx.restore();
const g=ctx.createRadialGradient(cx,cy,50,cx,cy,310+fl*2);g.addColorStop(0,'rgba(10,12,30,0)');g.addColorStop(1,'rgba(10,12,30,.9)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
coins.forEach((c,i)=>{if(got[i])return;const x=c[0]-cam,y=c[1]+Math.sin(t/20+i)*3;
const h=ctx.createRadialGradient(x,y,2,x,y,22);h.addColorStop(0,'rgba(255,184,77,.8)');h.addColorStop(1,'rgba(255,184,77,0)');ctx.fillStyle=h;ctx.fillRect(x-22,y-22,44,44);
ctx.fillStyle='#fff3c4';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill()});
ctx.fillStyle='#ff5d73';ctx.textAlign='center';
for(const r of rocks){const x=r.x-cam;if(r.wt>0){ctx.globalAlpha=.5+.5*Math.sin(t/3);ctx.beginPath();ctx.moveTo(x-10,8);ctx.lineTo(x+10,8);ctx.lineTo(x,30);ctx.fill();ctx.globalAlpha=1}else{ctx.beginPath();ctx.moveTo(x,r.y+14);ctx.lineTo(x-9,r.y-12);ctx.lineTo(x+9,r.y-12);ctx.fill()}}
for(const b of bats){if(b.wt>0){ctx.globalAlpha=.5+.5*Math.sin(t/3);ctx.font='700 26px sans-serif';ctx.fillText('!',W-18,b.y+8);ctx.globalAlpha=1}else{const x=b.x-cam,y=b.y+Math.sin(t/8+b.ph)*6;ctx.beginPath();ctx.ellipse(x,y,13,6,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-7,y-2,3,3);ctx.fillRect(x+3,y-2,3,3);ctx.fillStyle='#ff5d73'}}
ctx.textAlign='left';ctx.fillStyle='#f3ecd8';ctx.font='16px "Trebuchet MS",sans-serif';
ctx.fillText('Fase '+(li+1)+'/'+LV.length+'   Faíscas '+got.filter(Boolean).length+'/'+coins.length+'   Quedas '+deaths,14,26);
if(msg>0){msg--;ctx.textAlign='center';ctx.globalAlpha=Math.min(1,msg/30);ctx.font='700 34px Georgia,serif';ctx.fillStyle='#ffb84d';ctx.fillText('Fase '+(li+1),W/2,90);ctx.globalAlpha=1}
}
function loop(){if(state==='play')step();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
